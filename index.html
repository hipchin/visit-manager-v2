<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="訪問管理">
  <meta name="theme-color" content="#ffffff">
  <title>訪問管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=20260629-1">
  <script>
    // ?debug=1 を付けた時だけ、iPhone Safari上にJSエラーを表示する
    (function () {
      if (!new URLSearchParams(location.search).has('debug')) return;
      function showDebugError(title, body) {
        var box = document.createElement('pre');
        box.style.position = 'fixed';
        box.style.left = '8px';
        box.style.right = '8px';
        box.style.bottom = '8px';
        box.style.zIndex = '99999';
        box.style.background = '#fee2e2';
        box.style.color = '#991b1b';
        box.style.padding = '12px';
        box.style.fontSize = '12px';
        box.style.whiteSpace = 'pre-wrap';
        box.style.border = '1px solid #ef4444';
        box.style.borderRadius = '8px';
        box.textContent = title + '\n' + body;
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        showDebugError('JS Error', 'message: ' + e.message + '\nsource: ' + e.filename + '\nline: ' + e.lineno + '\ncol: ' + e.colno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        showDebugError('Promise Error', String(e.reason && e.reason.stack ? e.reason.stack : e.reason));
      });
    })();
  </script>
</head>
<body>

  <!-- リスト画面 -->
  <div id="screen-list" class="screen active">
    <header class="header">
      <h1 class="header-title">訪問リスト</h1>
      <div class="header-actions">
        <button class="icon-btn" id="btn-filter" aria-label="フィルター">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <button class="icon-btn" id="btn-trash-nav" aria-label="ゴミ箱">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings-nav" aria-label="設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- フィルターバー -->
    <div id="filter-bar" class="filter-bar hidden">
      <div class="filter-tags" id="filter-tags-list"></div>
      <button class="filter-clear hidden" id="btn-filter-clear">クリア</button>
    </div>

    <div class="search-wrap">
      <input type="search" id="search-input" class="search-input" placeholder="住所・名前で検索">
    </div>

    <div class="backup-notice hidden" id="backup-notice">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="backup-notice-text"></span>
    </div>

    <div class="list-container" id="visit-list"></div>

    <button class="fab" id="btn-add" aria-label="新規追加">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <!-- 詳細・編集画面 -->
  <div id="screen-detail" class="screen">
    <header class="header">
      <button class="icon-btn" id="btn-back-detail" aria-label="戻る">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="header-title" id="detail-title">新規登録</h1>
      <div class="header-actions">
        <button class="icon-btn danger hidden" id="btn-delete-entry" aria-label="削除">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
      </div>
    </header>

    <div class="form-container">
      <input type="hidden" id="field-id">

      <div class="form-section">
        <label class="form-label">住所 <span class="required">*</span></label>
        <div class="address-row">
          <input type="text" id="field-address" class="form-input" placeholder="横浜市鶴見区〇〇町1-2-3">
          <button class="map-inline-btn" id="btn-map-preview" aria-label="マップで確認">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          </button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-section half">
          <label class="form-label">名前</label>
          <input type="text" id="field-name" class="form-input" placeholder="（任意）">
        </div>
        <div class="form-section half">
          <label class="form-label">性別</label>
          <select id="field-gender" class="form-select">
            <option value="">未設定</option>
            <option value="male">男性</option>
            <option value="female">女性</option>
            <option value="other">その他</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">会えた時間帯</label>
        <div class="time-options" id="time-options">
          <button class="time-chip" data-value="morning">午前</button>
          <button class="time-chip" data-value="afternoon">午後</button>
          <button class="time-chip" data-value="evening">夕方</button>
          <button class="time-chip" data-value="night">夜</button>
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">最終訪問日</label>
        <input type="date" id="field-last-visit" class="form-input">
      </div>

      <div class="form-section">
        <label class="form-label">タグ</label>
        <div class="tag-input-wrap">
          <div class="selected-tags" id="selected-tags"></div>
          <button class="tag-add-btn" id="btn-tag-picker" type="button">+ タグを追加</button>
        </div>
      </div>

      <div class="form-section">
        <label class="form-label">メモ</label>
        <textarea id="field-memo" class="form-textarea" placeholder="会話の内容、印象など" rows="5"></textarea>
      </div>

      <!-- 訪問履歴 -->
      <div class="form-section" id="visit-history-section" style="display:none;">
        <label class="form-label">訪問履歴</label>
        <div id="visit-history-list" class="history-list"></div>
        <div style="display:flex;gap:8px;">
          <button class="add-visit-btn" id="btn-add-visit" type="button" style="flex:1;">+ 会えた</button>
          <button class="add-visit-btn absent" id="btn-add-absent" type="button" style="flex:1;">+ 不在</button>
        </div>
      </div>

      <button class="btn-primary detail-save-btn" id="btn-save">保存</button>
    </div>
  </div>

  <!-- ゴミ箱画面 -->
  <div id="screen-trash" class="screen">
    <header class="header">
      <button class="icon-btn" id="btn-back-trash" aria-label="戻る">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="header-title">ゴミ箱</h1>
      <div class="header-actions"></div>
    </header>
    <p class="trash-note">削除から30日以内は復元できます</p>
    <div class="list-container" id="trash-list"></div>
  </div>

  <!-- 設定画面 -->
  <div id="screen-settings" class="screen">
    <header class="header">
      <button class="icon-btn" id="btn-back-settings" aria-label="戻る">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="header-title">設定</h1>
      <div class="header-actions"></div>
    </header>

    <div class="settings-container">
      <section class="settings-section">
        <h2 class="settings-section-title">タグ管理</h2>
        <div id="tags-list" class="tags-manage-list"></div>
        <button class="btn-secondary" id="btn-add-tag">+ タグを追加</button>
      </section>

      <section class="settings-section">
        <h2 class="settings-section-title">バックアップ</h2>
        <div class="backup-info">
          <p class="backup-last" id="backup-last-text">最終バックアップ：なし</p>
        </div>
        <button class="btn-secondary" id="btn-export">バックアップを取る</button>
        <button class="btn-secondary" id="btn-import">バックアップから復元</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </section>

      <section class="settings-section">
        <h2 class="settings-section-title">アプリ更新</h2>
        <p class="settings-desc">最新バージョンに手動で更新します</p>
        <button class="btn-secondary" id="btn-update">アプリを更新</button>
        <p class="version-text" id="version-text"></p>
      </section>
    </div>
  </div>

  <!-- タグピッカーモーダル -->
  <div id="modal-tag-picker" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title">タグを選択</span>
        <button class="icon-btn" id="btn-close-tag-picker" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="tag-picker-list" class="tag-picker-list"></div>
    </div>
  </div>

  <!-- タグ追加・編集モーダル -->
  <div id="modal-add-tag" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="tag-modal-title">タグを追加</span>
        <button class="icon-btn" id="btn-close-add-tag" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="text" id="new-tag-name" class="form-input" placeholder="タグ名">
        <label class="form-label" style="margin-top:12px;">色</label>
        <div class="color-picker" id="color-picker"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="btn-save-tag">追加</button>
      </div>
    </div>
  </div>

  <!-- 訪問記録モーダル -->
  <div id="modal-visit" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="visit-modal-title">訪問を記録</span>
        <button class="icon-btn" id="btn-close-visit" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="form-label">訪問日</label>
        <input type="date" id="visit-date" class="form-input">
        <label class="form-label" style="margin-top:12px;">時間帯</label>
        <div class="time-options" id="visit-time-options">
          <button class="time-chip" data-value="morning">午前</button>
          <button class="time-chip" data-value="afternoon">午後</button>
          <button class="time-chip" data-value="evening">夕方</button>
          <button class="time-chip" data-value="night">夜</button>
        </div>
        <label class="form-label" style="margin-top:12px;">メモ</label>
        <textarea id="visit-memo" class="form-textarea" rows="3" placeholder="会話内容など"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="btn-save-visit">記録</button>
      </div>
    </div>
  </div>

  <!-- 不在記録モーダル -->
  <div id="modal-absent" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-title" id="absent-modal-title">不在を記録</span>
        <button class="icon-btn" id="btn-close-absent" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="form-label">訪問日</label>
        <input type="date" id="absent-date" class="form-input">
        <label class="form-label" style="margin-top:12px;">メモ（任意）</label>
        <textarea id="absent-memo" class="form-textarea" rows="2" placeholder="ポストに不在票など"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="btn-save-absent">記録</button>
      </div>
    </div>
  </div>

  <!-- 確認ダイアログ -->
  <div id="modal-confirm" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet" style="border-radius:20px;margin:20px;max-height:none;">
      <div class="modal-body" style="padding:24px 20px 16px;">
        <p id="confirm-message" style="font-size:15px;line-height:1.6;color:var(--text);"></p>
      </div>
      <div class="modal-footer" style="display:flex;gap:8px;padding:8px 16px 20px;">
        <button id="btn-confirm-cancel" class="btn-secondary" style="margin:0;flex:1;">キャンセル</button>
        <button id="btn-confirm-ok" class="btn-primary" style="margin:0;flex:1;">OK</button>
      </div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/db.js?v=20260629-1"></script>
  <script src="js/tags.js?v=20260629-1"></script>
  <script src="js/ui.js?v=20260629-1"></script>
  <script src="js/app.js?v=20260629-1"></script>
</body>
</html>
